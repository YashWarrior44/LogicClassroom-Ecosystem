org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The project lives under "Source Code📜". The Android Gradle Plugin refuses
# to build from a path with non-ASCII characters in it on Windows unless told
# otherwise. export_binaries.py still builds through an ASCII junction, which
# is the reliable route; this flag is what lets Android Studio open the
# project in place.
android.overridePathCheck=true
