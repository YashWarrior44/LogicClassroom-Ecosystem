<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Behind: dashed, because it is now underneath -->
  <rect x="3" y="3" width="11" height="11" rx="2" stroke-dasharray="2.4 2.4"/>
  <!-- In front: solid outline over a soft fill, covering the corner of the other -->
  <rect x="10" y="10" width="11" height="11" rx="2" fill="currentColor" fill-opacity="0.35"/>
</svg>
