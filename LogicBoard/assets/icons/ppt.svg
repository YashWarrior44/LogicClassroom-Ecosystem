<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pptBody" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="pptFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="pptBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <!-- Document body — all corners rounded (r=4); top-right is the fold -->
  <path d="M16 8 L42 8 L52 18 L52 54 A4 4 0 0 1 48 58 L16 58 A4 4 0 0 1 12 54 L12 12 A4 4 0 0 1 16 8 Z" fill="url(#pptBody)"/>
  <!-- Folded corner -->
  <path d="M42 8 L52 18 L42 18 Z" fill="url(#pptFold)"/>
  <path d="M42 8 L42 18 L52 18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Slide thumbnail -->
  <rect x="17" y="22" width="24" height="15" rx="2" fill="#ffffff" fill-opacity="0.20"/>
  <rect x="17" y="22" width="24" height="4"  rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Badge strip — flat top, rounded bottom corners matching the body -->
  <path d="M12 40 L52 40 L52 54 A4 4 0 0 1 48 58 L16 58 A4 4 0 0 1 12 54 Z" fill="url(#pptBadge)"/>
  <rect x="12" y="40" width="40" height="3" fill="#000000" fill-opacity="0.15"/>
  <text x="32" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PPT</text>
</svg>
