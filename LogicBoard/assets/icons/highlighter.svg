<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hlBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="hlNib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Translucent highlight swipe under the tip — THE highlighter cue -->
  <rect x="11" y="49" width="36" height="8" rx="4"
        transform="rotate(-7 29 53)" fill="#facc15" fill-opacity="0.82"/>

  <g transform="rotate(-45 32 33)">
    <!-- Barrel -->
    <rect x="26" y="25" width="26" height="16" rx="5" fill="url(#hlBody)"/>
    <!-- back butt-cap -->
    <rect x="48" y="25" width="4" height="16" rx="2" fill="#f59e0b"/>
    <!-- top sheen on the barrel -->
    <rect x="28" y="26" width="22" height="4.5" rx="2.2" fill="#ffffff" fill-opacity="0.3"/>

    <!-- Collar band between barrel and nib -->
    <rect x="21" y="25" width="6" height="16" fill="#f59e0b"/>

    <!-- Chisel felt nib (lighter), with a flat angled tip -->
    <path d="M21 25 L21 41 L14 41 L11 37 L11 29 L14 25 Z" fill="url(#hlNib)"/>
    <!-- chisel edge highlight -->
    <path d="M11 29 L14 25 L14 41 L11 37 Z" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
