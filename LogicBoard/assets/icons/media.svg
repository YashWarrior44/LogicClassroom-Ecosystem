<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="medFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="medBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="medPlay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </radialGradient>
  </defs>

  <!-- Offset back card → implies a stack / library of media -->
  <rect x="22" y="12" width="32" height="26" rx="6" fill="url(#medBack)" fill-opacity="0.55"/>
  <!-- Second, fainter card for depth -->
  <rect x="18" y="16" width="33" height="27" rx="6" fill="url(#medBack)" fill-opacity="0.8"/>

  <!-- Front media card -->
  <rect x="11" y="21" width="36" height="30" rx="7" fill="url(#medFront)"/>
  <!-- Soft top sheen on the front card -->
  <path d="M18 21 H40 A7 7 0 0 1 47 28 V29 H11 V28 A7 7 0 0 1 18 21 Z"
        fill="#ffffff" fill-opacity="0.16"/>

  <!-- Play triangle, centered on the front card -->
  <path d="M25.5 30 L25.5 42 L38 36 Z" fill="url(#medPlay)"/>
</svg>
