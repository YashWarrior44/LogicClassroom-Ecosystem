<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dpBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b3fc6"/>
    </linearGradient>
    <linearGradient id="dpSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c5cf0"/>
    </linearGradient>
    <linearGradient id="dpFrontTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dpBackTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- diagonal pen body (top-right to bottom-left), oriented like pen.svg -->
  <path d="M44 12 L52 20 L20 52 L12 44 Z" fill="url(#dpBody)"/>
  <!-- thin highlight stripe along the body -->
  <path d="M44 12 L48 16 L16 48 L12 44 Z" fill="url(#dpSheen)" fill-opacity="0.55"/>
  <!-- collar separating the back tip from the body -->
  <path d="M42 10 L54 22 L50 26 L38 14 Z" fill="#3b2a8a"/>
  <!-- back tip (top-right): chunky highlighter/eraser-like cap -->
  <path d="M50 6 L58 14 L54 18 L46 10 Z" fill="url(#dpBackTip)"/>
  <path d="M50 6 L54 10 L48 16 L46 10 Z" fill="#ffffff" fill-opacity="0.30"/>
  <!-- collar separating the front tip from the body -->
  <path d="M22 50 L14 42 L10 46 L18 54 Z" fill="#3b2a8a"/>
  <!-- front tip (bottom-left): nib + bright sheen -->
  <path d="M18 50 L14 46 L6 56 Z" fill="url(#dpFrontTip)"/>
  <path d="M18 50 L16 48 L9 53 Z" fill="#ffffff" fill-opacity="0.30"/>
</svg>
