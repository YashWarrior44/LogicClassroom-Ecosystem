<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="erTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="erHolder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- crumbs flicking off the erasing edge (signals 'eraser') -->
  <circle cx="15" cy="50" r="1.7" fill="#f9a8d4"/>
  <circle cx="20" cy="53" r="1.3" fill="#f9a8d4"/>
  <circle cx="25" cy="51" r="1.5" fill="#f9a8d4"/>

  <g transform="rotate(-30 32 33)">
    <!-- full body = holder (lavender), one clean rounded block -->
    <rect x="13" y="24" width="38" height="18" rx="5" fill="url(#erHolder)"/>

    <!-- erasing tip (pink): left section with rounded LEFT corners and a
         straight right edge at the divide — avoids the 'two squares' look -->
    <path d="M18 24 H33 V42 H18 A5 5 0 0 1 13 37 V29 A5 5 0 0 1 18 24 Z"
          fill="url(#erTip)"/>

    <!-- crisp divider between tip and holder -->
    <line x1="33" y1="24" x2="33" y2="42" stroke="#b59ef0" stroke-width="1.4"/>

    <!-- soft top sheen across the whole block -->
    <path d="M18 24 H46 A5 5 0 0 1 51 29 V30 H13 V29 A5 5 0 0 1 18 24 Z"
          fill="#ffffff" fill-opacity="0.22"/>
  </g>
</svg>
